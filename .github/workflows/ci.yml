name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --extra mcp --extra dev
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Install Sentinel (gate backend, pinned for reproducibility)
        run: uv pip install "sentinel @ git+https://github.com/Sachitt-AV-08/sentinel.git@ad90f5d95d872203153672610009e4609cb28d04"
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Test (offline — no browser needed)
        run: uv run --no-sync pytest
      - name: CLI smoke (demo)
        run: |
          uv run --no-sync orvima --version
          uv run --no-sync orvima run "check the products page" --mode demo

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Smoke test wheel
        run: |
          # Resolve the wheel first: `dist/*.whl[mcp]` fails because bash globs the
          # whole word, so `[mcp]` is read as a character class matching nothing
          # and pip is handed the literal string.
          WHEEL=$(ls dist/*.whl | head -1)
          pip install "${WHEEL}[mcp]"
          orvima --version
          orvima doctor --help