<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown Test</title>
  <style>
    body { font-family: system-ui; padding: 2rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; }
    select { width: 100%; max-width: 300px; padding: 0.5rem; }
    button { padding: 0.75rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #result { margin-top: 1rem; padding: 1rem; background: #f3f4f6; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h1>Dropdown Selection</h1>
  <form id="dropdown-form">
    <div class="form-group">
      <label for="country">Select Country</label>
      <select id="country" name="country" required>
        <option value="">Select a country...</option>
        <option value="us">United States</option>
        <option value="ca">Canada</option>
        <option value="uk">United Kingdom</option>
        <option value="de">Germany</option>
        <option value="fr">France</option>
        <option value="jp">Japan</option>
        <option value="au">Australia</option>
      </select>
    </div>
    <div class="form-group">
      <label for="priority">Priority</label>
      <select id="priority" name="priority" required>
        <option value="">Select priority...</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
      </select>
    </div>
    <button type="submit">Submit</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById('dropdown-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const country = document.getElementById('country').value;
      const priority = document.getElementById('priority').value;
      document.getElementById('result').innerHTML = `
        <strong>Selected:</strong><br>
        Country: ${country}<br>
        Priority: ${priority}
      `;
      document.getElementById('result').style.display = 'block';
    });
  </script>
</body>
</html>
