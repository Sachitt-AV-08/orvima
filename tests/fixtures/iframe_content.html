<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iframe Content</title>
  <style>
    body { font-family: system-ui; padding: 2rem; background: #f9fafb; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; }
    input, select { width: 100%; max-width: 300px; padding: 0.5rem; }
    button { padding: 0.75rem 1.5rem; background: #16a34a; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Embedded Form</h2>
  <form id="iframe-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />
    </div>
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">Select...</option>
        <option value="a">Option A</option>
        <option value="b">Option B</option>
        <option value="c">Option C</option>
      </select>
    </div>
    <button type="submit">Submit</button>
  </form>
  <div id="result" style="margin-top: 1rem; display: none;"></div>

  <script>
    document.getElementById('iframe-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const category = document.getElementById('category').value;
      document.getElementById('result').textContent = `Submitted: ${name} (${category})`;
      document.getElementById('result').style.display = 'block';
    });
  </script>
</body>
</html>
