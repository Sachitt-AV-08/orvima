<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>orvima logo concepts</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0D1117; color: #e6edf3;
         font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; padding: 32px 40px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  p.sub { margin: 0 0 32px; color: #8b949e; }
  h2 { font-size: 15px; margin: 40px 0 12px; font-weight: 600; color: #F5A524; }
  .row { display: flex; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
  .dark { background: #0D1117; padding: 20px 24px; border: 1px solid #30363d; border-radius: 10px; }
  .light { background: #ffffff; padding: 20px 24px; border: 1px solid #d0d7de; border-radius: 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cell span { font-size: 11px; color: #8b949e; font-variant-numeric: tabular-nums; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup b { font-weight: 600; letter-spacing: -0.01em; }
  .wordmark { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<h1>orvima &mdash; logo concepts</h1>
<p class="sub">Concept A, a &ldquo;held&rdquo; O &nbsp;&middot;&nbsp; Concept B, a tab-eye. Accent <code>#F5A524</code> on <code>#0D1117</code>.</p>

<h2>A &mdash; the held O</h2>
<div class="row">
  <div class="dark">
    <div class="cell"><img src="concept-a.svg" width="128" height="128" alt=""><span>128</span></div>
    <div class="cell"><img src="concept-a.svg" width="64" height="64" alt=""><span>64</span></div>
    <div class="cell"><img src="concept-a.svg" width="32" height="32" alt=""><span>32</span></div>
    <div class="cell"><img src="concept-a.svg" width="16" height="16" alt=""><span>16 favicon</span></div>
  </div>
  <div class="light">
    <div class="cell"><img src="concept-a.svg" width="128" height="128" alt=""><span>128</span></div>
    <div class="cell"><img src="concept-a.svg" width="32" height="32" alt=""><span>32</span></div>
    <div class="cell"><img src="concept-a.svg" width="16" height="16" alt=""><span>16 favicon</span></div>
  </div>
  <div class="dark">
    <div class="lockup"><img src="concept-a.svg" width="28" height="28" alt=""><b style="font-size:22px">orvima</b></div>
    <div class="lockup"><img src="concept-a.svg" width="20" height="20" alt=""><b style="font-size:16px">orvima</b></div>
  </div>
</div>

<h2>B &mdash; the tab-eye</h2>
<div class="row">
  <div class="dark">
    <div class="cell"><img src="concept-b.svg" width="128" height="128" alt=""><span>128</span></div>
    <div class="cell"><img src="concept-b.svg" width="64" height="64" alt=""><span>64</span></div>
    <div class="cell"><img src="concept-b.svg" width="32" height="32" alt=""><span>32</span></div>
    <div class="cell"><img src="concept-b.svg" width="16" height="16" alt=""><span>16 favicon</span></div>
  </div>
  <div class="light">
    <div class="cell"><img src="concept-b.svg" width="128" height="128" alt=""><span>128</span></div>
    <div class="cell"><img src="concept-b.svg" width="32" height="32" alt=""><span>32</span></div>
    <div class="cell"><img src="concept-b.svg" width="16" height="16" alt=""><span>16 favicon</span></div>
  </div>
  <div class="dark">
    <div class="lockup"><img src="concept-b.svg" width="28" height="28" alt=""><b style="font-size:22px">orvima</b></div>
    <div class="lockup"><img src="concept-b.svg" width="20" height="20" alt=""><b style="font-size:16px">orvima</b></div>
  </div>
</div>
</body>
</html>
